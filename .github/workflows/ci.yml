name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (jj ${{ matrix.jj }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jj: ["0.45.1", "0.46.0"]
    steps:
      - uses: actions/checkout@v7

      # Runs alongside the Rust steps below. Its PATH change only applies after
      # the `wait` step.
      - name: Install jj ${{ matrix.jj }}
        id: install-jj
        background: true
        env:
          VER: ${{ matrix.jj }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v$VER/jj-v$VER-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Installs the toolchain and components in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Wait for jj
        wait: install-jj

      - run: jj --version
      - run: cargo test
